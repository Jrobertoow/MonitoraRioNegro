      <stop offset="0.5" stop-color="#ffc45c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e69a25" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
