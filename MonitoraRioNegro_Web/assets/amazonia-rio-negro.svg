<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Paisagem amazônica do Rio Negro</title>
  <desc id="desc">Ilustração vetorial com floresta, rio, pôr do sol e aves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06283a"/>
      <stop offset="0.5" stop-color="#0b5361"/>
      <stop offset="1" stop-color="#e0a53a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
